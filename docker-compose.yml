version: "3"
services:
    web:
        container_name: appifylab-technical-assessment
        build:
            dockerfile: Dockerfile.dev
            context: .
        depends_on:
            - db
        ports:
            - "3000:3000"
        volumes:
            - .:/server
        environment:
            - MYSQL_HOST=db
            - MYSQL_DATABASE=appifylab_technical_assessment
            - MYSQL_USER=root
            - MYSQL_PASSWORD=root
            - APPLICATION_SERVER_PORT=3000
            - APP_FORCE_SHUTDOWN_SECOND=30
            - REDIS_HOST=redis

    # Database
    db:
        image: mysql:8.0
        ports:
        - "3306:3306"
        restart: always
        environment:
            MYSQL_ROOT_PASSWORD: root
            MYSQL_DATABASE: appifylab_technical_assessment

    # phpmyadmin
    phpmyadmin:
        depends_on:
        - db
        image: phpmyadmin/phpmyadmin
        restart: always
        ports:
        - "8080:80"
        environment:
            PMA_HOST: db
            MYSQL_ROOT_PASSWORD: root
    # Redis
    redis:
        image: redis:7.0
        container_name: redis
        ports:
            - "6379:6379"
